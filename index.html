<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy New Year Surprise</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffe4e1, #dda0dd, #ffd700);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            color: #8b008b;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .quiz {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .quiz h2 {
            font-size: 1.5em;
            color: #ff69b4;
        }
        .quiz p {
            margin-bottom: 10px;
        }
        .quiz label {
            display: block;
            margin: 6px 0;
            font-size: 1em;
        }
        button {
            background: linear-gradient(45deg, #ff69b4, #dda0dd);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .error {
            color: #b22222;
            margin-top: 10px;
            font-size: 0.95em;
        }
        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            p { font-size: 1em; }
            .quiz { padding: 15px; }
        }
    </style>
</head>
<body>
    <h1>Happy New Year, My Love</h1>
    <p>Let’s start the new year with a little quiz about us. Answer these and then see your surprise. 💕</p>

    <div class="quiz">
        <h2>Quiz Time</h2>

        <p>Q1. Our first date food:</p>
        <label><input type="radio" name="q1" value="ras malai"> Ras malai</label>
        <label><input type="radio" name="q1" value="pizza"> Pizza</label>
        <label><input type="radio" name="q1" value="ice cream"> Ice cream</label>
        <label><input type="radio" name="q1" value="faluda"> Faluda</label>

        <p style="margin-top:15px;">Q2. At which station did we have our first ice cream?</p>
        <label><input type="radio" name="q2" value="yamuna bank"> Yamuna Bank</label>
        <label><input type="radio" name="q2" value="uttam nagar west"> Uttam Nagar West</label>
        <label><input type="radio" name="q2" value="anand vihar"> Anand Vihar</label>
        <label><input type="radio" name="q2" value="welcome"> Welcome</label>

        <div id="error" class="error"></div>
    </div>

    <button onclick="checkAnswers()">Show my surprise</button>

    <script>
        function checkAnswers() {
            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');
            const errorDiv = document.getElementById('error');

            if (!q1 || !q2) {
                errorDiv.textContent = "Please answer both questions first.";
                return;
            }

            if (q1.value === "ras malai" && q2.value === "anand vihar") {
                // All correct → go to second page
                window.location.href = "surprise.html";
            } else {
                // Wrong → ask to try again
                errorDiv.textContent = "Oops, that’s not quite right. Try again, my love! ❤️";
            }
        }
    </script>
</body>
</html>
